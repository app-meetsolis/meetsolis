top_issues:
  - id: MAINT-001
    severity: low
    title: 'AIIntelligenceStrip.tsx at 470 lines — one change from the 500-line cap'
    refs: ['apps/web/src/components/client/AIIntelligenceStrip.tsx']
    rationale: |
      Component houses the main strip, ClickToEdit primitive, RefreshButton,
      ThemeRow, EditableStripField, and CoachNotesField — all sensible as
      one unit today, but the next addition (avatar, action menu, etc.) will
      force a split mid-change. Extracting ClickToEdit + RefreshButton to
      sibling files now is cheap insurance.
    suggested_owner: dev
    fix: 'Extract ClickToEdit → components/client/ClickToEdit.tsx; RefreshButton → components/client/StripRefreshButton.tsx. Re-run tests.'
  - id: TEST-001
    severity: low
    title: 'No React Testing Library coverage for AIIntelligenceStrip.tsx behaviors'
    refs: ['apps/web/src/components/client/AIIntelligenceStrip.tsx']
    rationale: |
      Server + lib layers are well-tested (19 unit/integration tests). The
      strip component itself has only implicit (manual) verification of:
      auto-trigger fires once when strip is null + hasSessions; error state
      renders Try-again button on mutation rejection; click-to-edit commits
      on Enter/blur and cancels on Esc. None of these are P0 (data-loss /
      security) so the gate stays PASS, but they're the natural next test
      layer.
    suggested_owner: dev
    fix: 'Add components/client/__tests__/AIIntelligenceStrip.test.tsx with three RTL specs (auto-trigger, error-state, click-to-edit).'
  - id: TEST-002
    severity: low
    title: 'summarize-session "does not flip to error on strip-gen failure" is only verified indirectly'
    refs:
      - 'apps/web/src/lib/sessions/summarize-session.ts:72-78 (fire-and-forget catch)'
      - 'apps/web/src/lib/clients/__tests__/generate-intelligence-strip.test.ts (captures errors to Sentry — proxy)'
    rationale: |
      AC says explicitly "Test: failing strip-gen does not flip session
      status to error". The fire-and-forget pattern in summarize-session
      makes this structurally true (the catch is right there) and the
      unit test for generate-intelligence-strip proves errors are
      Sentry-captured rather than rethrown. But there's no test that
      reads back session.status after deliberately failing a strip-gen.
      Add one to remove the trust-the-code gap.
    suggested_owner: dev

